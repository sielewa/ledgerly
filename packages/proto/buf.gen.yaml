version: v2
clean: true
plugins:
  - local: ./node_modules/.bin/protoc-gen-ts_proto
    out: src/gen
    opt:
      # Generate NestJS-friendly controller/client interfaces for services.
      - nestJs=true
      # NestJS (de)serializes messages itself via @grpc/proto-loader at runtime,
      # so we only need types — no encode/decode/JSON helpers.
      - outputEncodeMethods=false
      - outputJsonMethods=false
      - outputClientImpl=false
      # int64 -> string in TS. Must match the runtime loader option `longs: String`.
      # (JS `number` silently loses precision above 2^53 — unacceptable for money.)
      - forceLong=string
      # Enums as string literals. Must match the runtime loader option `enums: String`.
      - stringEnums=true
      # Pass gRPC Metadata to handlers (we'll carry correlation IDs in it).
      - addGrpcMetadata=true
